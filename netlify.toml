[build]
  command = "node scripts/apply_emergency_billing_netlify.mjs && node scripts/migrate_auth_passwords.mjs --apply && pnpm build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_PATHS = "apply_migration.py, run_migration.py, run_sql_migration.py, test_supabase.py"
  SECRETS_SCAN_OMIT_KEYS = "R2_BUCKET"

# SPA fallback so deep links and refreshes work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
