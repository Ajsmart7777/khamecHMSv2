[build]
  command = "pnpm build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_PATHS = "apply_migration.py, run_migration.py, run_sql_migration.py, test_supabase.py"

# SPA fallback so deep links and refreshes work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
